services:
  - type: web
    name: big-backend
    env: python
    buildCommand: >-
      cd data_cleaner &&
      npm install &&
      npm run build &&
      cd ../backend &&
      pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_PATH
        value: patent_database.db
